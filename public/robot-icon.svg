<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#7c3aed"/>

  <!-- Antenna base -->
  <rect x="46" y="8" width="8" height="18" rx="4" fill="#a78bfa"/>
  <!-- Antenna ball -->
  <circle cx="50" cy="7" r="7" fill="#c4b5fd"/>

  <!-- Head -->
  <rect x="18" y="26" width="64" height="44" rx="12" fill="white" opacity="0.95"/>

  <!-- Left eye -->
  <circle cx="35" cy="46" r="10" fill="#7c3aed"/>
  <circle cx="37" cy="44" r="4" fill="white" opacity="0.8"/>
  <circle cx="35" cy="46" r="3" fill="#4c1d95"/>

  <!-- Right eye -->
  <circle cx="65" cy="46" r="10" fill="#7c3aed"/>
  <circle cx="67" cy="44" r="4" fill="white" opacity="0.8"/>
  <circle cx="65" cy="46" r="3" fill="#4c1d95"/>

  <!-- Mouth -->
  <rect x="33" y="60" width="34" height="6" rx="3" fill="#7c3aed"/>
  <rect x="38" y="60" width="6" height="6" rx="1" fill="#a78bfa"/>
  <rect x="48" y="60" width="6" height="6" rx="1" fill="#a78bfa"/>
  <rect x="58" y="60" width="6" height="6" rx="1" fill="#a78bfa"/>

  <!-- Left ear -->
  <rect x="8" y="38" width="10" height="14" rx="4" fill="#a78bfa"/>
  <!-- Right ear -->
  <rect x="82" y="38" width="10" height="14" rx="4" fill="#a78bfa"/>

  <!-- Neck -->
  <rect x="42" y="70" width="16" height="8" rx="3" fill="#ddd6fe"/>

  <!-- Body bottom hint -->
  <rect x="28" y="78" width="44" height="14" rx="8" fill="#7c3aed" opacity="0.15"/>
</svg>
